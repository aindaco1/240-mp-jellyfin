name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: macOS arm64 build and test
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          if brew tap | grep -Fxq aws/tap; then
            brew untap aws/tap
          fi
          missing_formulae=()
          for formula in cmake qt mpv ffmpeg; do
            if ! brew list --versions "$formula" >/dev/null; then
              missing_formulae+=("$formula")
            fi
          done
          if (( ${#missing_formulae[@]} > 0 )); then
            brew install "${missing_formulae[@]}"
          fi
          echo "QT_ROOT_DIR=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Lint QML
        run: |
          "${QT_ROOT_DIR}/bin/qmllint" -I views \
            Main.qml \
            views/*.qml \
            views/Components/*.qml \
            modules/jellyfin/views/*.qml \
            modules/karaoke/views/*.qml \
            modules/retro_tv/views/*.qml \
            modules/local_files/views/*.qml \
            modules/ambient_mode/views/*.qml \
            modules/tumblr_screensaver/views/*.qml

      - name: Smoke-test mpv OSD
        run: |
          mpv --no-config \
            --script=scripts/mpv-osc.lua \
            --vo=null --ao=null --frames=1 \
            'av://lavfi:color=c=black:s=640x480:d=0.1'
